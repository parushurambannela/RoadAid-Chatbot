<div class="chat-shell">

  <!-- Header -->
  <header class="chat-header">
    <div class="header-left">
      <span class="header-icon">🛣️</span>
      <div>
        <span class="header-title">RoadAid Assistant</span>
        <span class="header-sub">AI-powered infrastructure insights</span>
      </div>
    </div>
    <button class="logout-btn" (click)="auth.logout()">Sign Out</button>
  </header>

  <!-- Messages -->
  <div class="message-list" #messageList>
    <div
      *ngFor="let msg of messages"
      class="message-row"
      [class.user-row]="msg.role === 'user'"
    >
      <div class="bubble" [class.user-bubble]="msg.role === 'user'" [class.bot-bubble]="msg.role === 'bot'">
        <!-- Loading dots -->
        <span *ngIf="msg.loading" class="dots">
          <span></span><span></span><span></span>
        </span>
        <!-- Message text -->
        <span *ngIf="!msg.loading" style="white-space: pre-wrap">{{ msg.text }}</span>
      </div>
    </div>
  </div>

  <!-- Input area -->
  <div class="input-area">
    <textarea
      [(ngModel)]="input"
      (keydown)="onKeyDown($event)"
      placeholder="Ask about roads, accidents, drivers…"
      rows="1"
      [disabled]="sending"
    ></textarea>
    <button class="send-btn" (click)="send()" [disabled]="!input.trim() || sending">
      <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>

</div>
